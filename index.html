<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">
<title>Study Tracker</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0a0d14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Study">
<meta name="mobile-web-app-capable" content="yes">
<meta name="HandheldFriendly" content="True">
<meta name="MobileOptimized" content="390">
<link rel="apple-touch-icon" href="icon.svg">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#0a0d14;--s1:#11151f;--s2:#181d2b;--s3:#1e2436;
  --b1:rgba(255,255,255,.06);--b2:rgba(255,255,255,.11);--b3:rgba(255,255,255,.18);
  --txt:#eceef4;--muted:#6b7490;--muted2:#4a5068;
  --blue:#4f8ef7;--blue-d:rgba(79,142,247,.16);--blue-d2:rgba(79,142,247,.08);
  --green:#34d399;--green-d:rgba(52,211,153,.14);
  --amber:#f59e0b;--amber-d:rgba(245,158,11,.14);
  --purple:#a78bfa;--red:#f87171;--pink:#f472b6;
  --font:'Noto Sans Thai',sans-serif;--mono:'JetBrains Mono',monospace;
  --nav-h:60px;
  --sidenav-w:0px;
  /* safe areas — Dynamic Island iPhone 16 Pro gets ~59px top, ~34px bottom */
  --safe-t:env(safe-area-inset-top,0px);
  --safe-b:env(safe-area-inset-bottom,0px);
  --safe-l:env(safe-area-inset-left,0px);
  --safe-r:env(safe-area-inset-right,0px);
  /* total nav height including safe area — used by screens */
  --nav-total:calc(var(--nav-h) + env(safe-area-inset-bottom,0px));
  /* tablet breakpoint flag */
  --tablet:0;
}

/* ── TABLET DETECTION (MatePad 11.5 ≥ 768px) — SIDE NAV LANDSCAPE ── */
@media(min-width:768px){
  :root{
    --nav-h:0px;
    --nav-total:0px;
    --sidenav-w:80px;
    --tablet:1;
  }
}

html{
  /* dvh = dynamic viewport height — accounts for iOS browser chrome & safe areas */
  height: 100dvh;
  height: -webkit-fill-available;
  overflow:hidden;
}
body{
  height:100%;
  overflow:hidden;
  background:var(--bg);color:var(--txt);font-family:var(--font);
  min-height:100dvh;
  min-height:-webkit-fill-available;
  -webkit-overflow-scrolling:touch;
}

/* ── SCREENS ── */
.screen{
  position:fixed;
  left:0;right:0;
  top:env(safe-area-inset-top, 0px);
  bottom:var(--nav-total);
  display:flex;flex-direction:column;overflow:hidden;
  opacity:0;pointer-events:none;
  transform:translateY(6px);
  transition:opacity .22s ease,transform .22s ease;
}
.screen.active{opacity:1;pointer-events:all;transform:none;}

/* tablet: screens sit to the right of the side nav */
@media(min-width:768px){
  .screen{
    left:var(--sidenav-w);
    top:0;
    bottom:0;
    transform:translateX(6px);
  }
  .screen.active{transform:none;}
}

/* ── BOTTOM NAV ── */
.nav{
  position:fixed;bottom:0;left:0;right:0;
  height:var(--nav-total);
  padding-bottom:env(safe-area-inset-bottom, 0px);
  background:var(--s1);
  border-top:1px solid var(--b1);
  display:flex;align-items:stretch;z-index:100;
}

/* tablet: side nav */
@media(min-width:768px){
  .nav{
    top:0;bottom:0;left:0;right:auto;
    width:var(--sidenav-w);
    height:100%;
    flex-direction:column;
    border-top:none;
    border-right:1px solid var(--b1);
    padding-bottom:0;
    padding-top:16px;
    justify-content:flex-start;
    gap:4px;
  }
}
.nav-btn{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:4px;border:none;background:none;cursor:pointer;
  color:var(--muted);font-family:var(--font);
  font-size:10px;font-weight:500;
  transition:color .18s;position:relative;
  min-height:48px;
  -webkit-tap-highlight-color:transparent;
}
.nav-btn.active{color:var(--blue);}
.nav-btn svg{width:24px;height:24px;stroke-width:1.8;fill:none;stroke:currentColor;stroke-linecap:round;stroke-linejoin:round;}
/* tablet: side nav buttons */
@media(min-width:768px){
  .nav-btn{
    flex:0 0 auto;
    width:100%;
    height:64px;
    font-size:10px;
    gap:5px;
    border-radius:12px;
    margin:0 6px;
    width:calc(100% - 12px);
  }
  .nav-btn svg{width:22px;height:22px;}
  .nav-btn.active{
    background:var(--blue-d);
    color:var(--blue);
  }
}
.sync-dot{position:absolute;top:8px;right:calc(50% - 13px);width:7px;height:7px;border-radius:50%;border:2px solid var(--s1);display:none;}
.sync-dot.show{display:block;}
.sync-dot.ok{background:var(--green);}
.sync-dot.err{background:var(--red);}
.sync-dot.loading{background:var(--amber);animation:pulse 1s infinite;}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
@media(min-width:768px){
  .sync-dot{top:10px;right:10px;}
}

/* ── ROTATE BUTTON (tablet only) ── */
.rotate-btn{display:none;}
@media(min-width:768px){
  .rotate-btn{display:flex;margin-top:auto !important;color:var(--muted2);}
  .rotate-btn:hover{color:var(--muted);}
}

/* ── FORCE LANDSCAPE via CSS transform ── */
body.rotated{
  transform-origin:top left;
  transform:rotate(90deg) translateX(0);
  width:100vh;
  height:100vw;
  overflow:hidden;
  position:fixed;
  top:0;left:0;
}

/* ── TABLET 2-COLUMN LAYOUT ── */
@media(min-width:768px){
  /* schedule screen: day-strip becomes sidebar */
  #screen-schedule{flex-direction:row;}
  .sch-header{
    width:220px;flex-shrink:0;
    border-bottom:none;border-right:1px solid var(--b1);
    flex-direction:column;
    overflow-y:auto;
  }
  .day-strip{flex-direction:column;overflow-y:auto;overflow-x:hidden;padding:4px 4px 8px;}
  .ds-pill{padding:10px 14px;border-radius:14px;font-size:13px;}
  .day-viewport{flex:1;}
  /* chat: wider input area */
  .input-row{padding:12px 16px;}
  #user-input{font-size:15px;}
  /* messages: center content on wide screens */
  .messages{padding:16px 20px 8px;}
  .mbubble{font-size:14px;}
  /* modal: centered card on tablet */
  .modal-backdrop{align-items:center;}
  .modal-sheet{max-width:520px;border-radius:24px;margin-bottom:0;padding:24px;}
}

/* ══ SCREEN 1: SCHEDULE ══ */
.sch-header{padding:16px 18px 10px;background:var(--s1);border-bottom:1px solid var(--b1);flex-shrink:0;}
/* on tablet this becomes a side column */
@media(min-width:768px){
  .sch-header{padding:16px 10px 16px;}
}
.sch-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
.sch-title{font-size:18px;font-weight:700;letter-spacing:-.02em;}
.sch-title span{color:var(--blue);}
.week-prog{display:flex;align-items:center;gap:4px;}
.wp-dot{width:6px;height:6px;border-radius:50%;background:var(--b2);transition:background .25s;}
.wp-dot.done{background:var(--green);}
.wp-dot.cur{background:var(--blue);box-shadow:0 0 5px var(--blue);}
.wp-dot.cls{background:var(--amber-d);border:1px solid rgba(245,158,11,.4);}
.wp-dot.cls.done{background:var(--green);border-color:var(--green);}
.wp-sep{width:1px;height:6px;background:var(--b2);margin:0 2px;}
.wp-label{font-size:10px;font-family:var(--mono);color:var(--muted);margin-right:4px;}
.day-strip{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:0 2px 2px;}
.day-strip::-webkit-scrollbar{display:none;}
.ds-pill{flex-shrink:0;padding:6px 12px;border-radius:20px;border:1.5px solid var(--b2);background:transparent;color:var(--muted);font-family:var(--font);font-size:12px;font-weight:500;cursor:pointer;white-space:nowrap;transition:all .15s;position:relative;}
.ds-pill.active{background:var(--blue-d);border-color:var(--blue);color:var(--txt);}
.ds-pill.cls{border-color:rgba(245,158,11,.4);color:var(--amber);}
.ds-pill.cls.active{background:var(--amber-d);border-color:var(--amber);}
.ds-pip{width:4px;height:4px;border-radius:50%;background:var(--green);position:absolute;top:4px;right:6px;opacity:0;}
.ds-pill.partial .ds-pip{opacity:.5;}
.ds-pill.full .ds-pip{opacity:1;}
.day-viewport{flex:1;overflow:hidden;position:relative;}
.day-track{display:flex;height:100%;transition:transform .32s cubic-bezier(.4,0,.2,1);}
.day-slide{flex-shrink:0;width:100%;height:100%;overflow-y:auto;overscroll-behavior:contain;}
.day-slide::-webkit-scrollbar{display:none;}
.slide-inner{padding:12px 16px 16px;display:flex;flex-direction:column;gap:8px;}
.slide-day-hdr{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border-radius:14px;background:var(--s2);border:1px solid var(--b1);}
.sdh-name{font-size:14px;font-weight:600;}
.sdh-right{display:flex;align-items:center;gap:8px;}
.sdh-count{font-size:11px;font-family:var(--mono);color:var(--muted);}
.sdh-bar{width:52px;height:4px;background:var(--b2);border-radius:2px;overflow:hidden;}
.sdh-fill{height:100%;background:linear-gradient(90deg,var(--green),#6ee7b7);border-radius:2px;transition:width .35s;}
.session-card{display:flex;align-items:flex-start;gap:10px;padding:14px 14px;border-radius:14px;background:var(--s2);border:1.5px solid var(--b1);cursor:pointer;transition:all .15s;-webkit-user-select:none;user-select:none;}
.session-card:active{transform:scale(.98);}
.session-card.checked{background:var(--green-d);border-color:rgba(52,211,153,.25);}
.sc-check{width:22px;height:22px;border-radius:7px;flex-shrink:0;border:2px solid var(--b3);margin-top:1px;display:flex;align-items:center;justify-content:center;transition:all .15s;}
.session-card.checked .sc-check{background:var(--green);border-color:var(--green);}
.session-card.checked .sc-check::after{content:'';width:9px;height:5px;border-left:2.5px solid #fff;border-bottom:2.5px solid #fff;transform:rotate(-45deg) translateY(-1px);display:block;}
.sc-body{flex:1;min-width:0;}
.sc-label{font-size:13px;font-weight:500;color:var(--muted);transition:color .15s;line-height:1.4;}
.session-card.checked .sc-label{color:var(--green);text-decoration:line-through;text-decoration-color:rgba(52,211,153,.4);}
.sc-sub{font-size:11px;color:var(--muted2);margin-top:2px;}
.sc-time{display:inline-block;font-size:10px;font-family:var(--mono);padding:1px 6px;border-radius:4px;background:var(--amber-d);color:var(--amber);margin-left:5px;vertical-align:middle;}
.topic-field{width:100%;margin-top:7px;background:var(--s3);border:1.5px solid var(--b2);border-radius:8px;padding:6px 10px;font-size:12px;color:var(--txt);font-family:var(--font);outline:none;transition:border-color .15s;}
.topic-field:focus{border-color:var(--blue);}
.tag-pill{display:inline-block;font-size:10px;font-family:var(--mono);padding:1px 6px;border-radius:4px;margin-right:4px;vertical-align:middle;}
.tag-math{background:rgba(79,142,247,.15);color:var(--blue);}
.tag-elec{background:rgba(167,139,250,.15);color:var(--purple);}
.tag-dig{background:rgba(52,211,153,.15);color:var(--green);}
.tag-phys{background:rgba(245,158,11,.15);color:var(--amber);}
.tag-mech{background:rgba(248,113,113,.15);color:var(--red);}

/* ══ SCREEN 2: STATS ══ */
#screen-stats{overflow-y:auto;}
.stats-scroll{padding:16px;display:flex;flex-direction:column;gap:14px;padding-bottom:16px;}
.stats-hdr{font-size:18px;font-weight:700;padding:16px 18px 0;}
.stat-card{background:var(--s2);border:1px solid var(--b1);border-radius:16px;padding:16px;}
.stat-card-title{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:12px;}
/* streak row */
.streak-row{display:flex;gap:10px;}
.streak-box{flex:1;background:var(--s3);border-radius:12px;padding:12px;text-align:center;}
.streak-num{font-size:28px;font-weight:700;font-family:var(--mono);}
.streak-num.fire{color:var(--amber);}
.streak-num.blue{color:var(--blue);}
.streak-num.green{color:var(--green);}
.streak-lbl{font-size:11px;color:var(--muted);margin-top:2px;}
/* heatmap */
.heatmap{display:flex;flex-direction:column;gap:3px;}
.hm-row{display:flex;gap:3px;align-items:center;}
.hm-lbl{font-size:9px;font-family:var(--mono);color:var(--muted2);width:22px;flex-shrink:0;}
.hm-cell{width:12px;height:12px;border-radius:2px;background:var(--b1);flex-shrink:0;transition:background .2s;}
.hm-cell.l1{background:rgba(52,211,153,.2);}
.hm-cell.l2{background:rgba(52,211,153,.45);}
.hm-cell.l3{background:rgba(52,211,153,.7);}
.hm-cell.l4{background:var(--green);}
.hm-cell.today-border{outline:1.5px solid var(--blue);outline-offset:1px;}
/* subject bars */
.subj-bar-row{display:flex;flex-direction:column;gap:8px;}
.sbr{display:flex;align-items:center;gap:10px;}
.sbr-name{font-size:11px;font-family:var(--mono);width:62px;flex-shrink:0;color:var(--muted);}
.sbr-track{flex:1;height:8px;background:var(--b1);border-radius:4px;overflow:hidden;}
.sbr-fill{height:100%;border-radius:4px;transition:width .5s;}
.sbr-cnt{font-size:10px;font-family:var(--mono);color:var(--muted2);width:24px;text-align:right;flex-shrink:0;}
/* topic history */
.topic-list{display:flex;flex-direction:column;gap:6px;max-height:240px;overflow-y:auto;}
.topic-list::-webkit-scrollbar{display:none;}
.topic-item{background:var(--s3);border-radius:10px;padding:9px 12px;}
.topic-date{font-size:10px;font-family:var(--mono);color:var(--muted2);margin-bottom:3px;}
.topic-text{font-size:12.5px;color:var(--txt);}
.topic-subj{font-size:10px;margin-top:3px;}
.empty-stats{text-align:center;color:var(--muted);font-size:12px;padding:20px 0;opacity:.6;}

/* ══ SCREEN 3: CHAT ══ */
.chat-header{padding:14px 16px 10px;background:var(--s1);border-bottom:1px solid var(--b1);flex-shrink:0;display:flex;align-items:center;justify-content:space-between;}
.chat-header-left{display:flex;flex-direction:column;gap:2px;}
.chat-title{font-size:16px;font-weight:700;}
.chat-sub{font-size:11px;color:var(--muted);}
.key-btn{display:flex;align-items:center;gap:5px;padding:6px 10px;border-radius:10px;background:var(--s3);border:1px solid var(--b2);color:var(--muted);font-size:11px;font-family:var(--font);cursor:pointer;transition:all .15s;white-space:nowrap;}
.key-btn.set{border-color:rgba(52,211,153,.3);color:var(--green);}
.ctx-bar{display:flex;gap:5px;padding:8px 16px;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--b1);flex-shrink:0;}
.ctx-bar::-webkit-scrollbar{display:none;}
.ctx-chip{font-size:10px;font-family:var(--mono);padding:3px 8px;border-radius:20px;white-space:nowrap;flex-shrink:0;}
.messages{flex:1;overflow-y:auto;padding:14px 14px 4px;display:flex;flex-direction:column;gap:10px;overscroll-behavior:contain;}
.messages::-webkit-scrollbar{display:none;}
.msg{display:flex;gap:7px;max-width:90%;animation:fadeUp .2s ease;}
@keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.msg.user{align-self:flex-end;flex-direction:row-reverse;}
.mavatar{width:26px;height:26px;border-radius:8px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;}
.msg.ai .mavatar{background:var(--blue-d);color:var(--blue);}
.msg.user .mavatar{background:var(--green-d);color:var(--green);}
.mbubble{padding:9px 12px;border-radius:14px;font-size:13.5px;line-height:1.65;white-space:pre-wrap;word-break:break-word;}
.msg.ai .mbubble{background:var(--s2);border:1px solid var(--b1);border-top-left-radius:4px;}
.msg.user .mbubble{background:var(--blue-d);border:1px solid rgba(79,142,247,.2);border-top-right-radius:4px;}
.tydot{display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--muted);margin:0 2px;animation:bounce 1.1s infinite;}
.tydot:nth-child(2){animation-delay:.18s}.tydot:nth-child(3){animation-delay:.36s}
@keyframes bounce{0%,80%,100%{transform:translateY(0);opacity:.35}40%{transform:translateY(-5px);opacity:1}}
.empty-chat{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:var(--muted);text-align:center;padding:20px;}
.empty-chat .ico{font-size:36px;opacity:.2;}
.quick-row{display:flex;gap:6px;padding:8px 14px;overflow-x:auto;scrollbar-width:none;flex-shrink:0;}
.quick-row::-webkit-scrollbar{display:none;}
.qchip{flex-shrink:0;padding:6px 12px;border-radius:20px;border:1px solid var(--b2);background:var(--s2);color:var(--muted);font-size:11.5px;font-family:var(--font);cursor:pointer;white-space:nowrap;transition:all .15s;}
.qchip:active{border-color:var(--blue);color:var(--blue);}
.input-row{
  padding:10px 12px;
  display:flex;gap:8px;align-items:flex-end;
  background:var(--s1);border-top:1px solid var(--b1);flex-shrink:0;
}
.web-btn{
  flex-shrink:0;width:38px;height:38px;border-radius:12px;border:1.5px solid var(--b2);
  background:none;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;
  transition:background .18s,border-color .18s;
  -webkit-tap-highlight-color:transparent;
}
.web-btn.on{background:var(--blue-d);border-color:var(--blue);}

/* model selector */
.model-row{
  display:flex;gap:6px;padding:6px 12px 2px;
  overflow-x:auto;flex-shrink:0;
  scrollbar-width:none;
}
.model-row::-webkit-scrollbar{display:none;}
.mchip{
  flex-shrink:0;
  padding:4px 12px;border-radius:20px;
  font-size:11px;font-weight:500;font-family:var(--font);
  border:1.5px solid var(--b2);background:none;
  color:var(--muted);cursor:pointer;
  transition:all .18s;
  -webkit-tap-highlight-color:transparent;
  white-space:nowrap;
}
.mchip.active{
  background:var(--blue-d);
  border-color:var(--blue);
  color:var(--blue);
}
.input-box{flex:1;background:var(--s3);border:1.5px solid var(--b2);border-radius:14px;padding:10px 13px;display:flex;align-items:flex-end;gap:8px;transition:border-color .18s;}
.input-box:focus-within{border-color:var(--blue);}
#user-input{flex:1;background:none;border:none;outline:none;color:var(--txt);font-family:var(--font);font-size:16px;/* 16px prevents iOS zoom */resize:none;max-height:110px;line-height:1.5;}
#user-input::placeholder{color:var(--muted2);}
.send-btn{width:38px;height:38px;border-radius:10px;background:var(--blue);border:none;color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:opacity .15s,transform .1s;}
.send-btn:active{transform:scale(.9);} .send-btn:disabled{opacity:.3;cursor:default;}
.send-btn svg{width:16px;height:16px;fill:none;stroke:#fff;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;}

/* ── MODALS ── */
.modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;align-items:flex-end;justify-content:center;z-index:200;backdrop-filter:blur(6px);}
.modal-backdrop.open{display:flex;}
.modal-sheet{
  width:100%;max-width:480px;
  background:var(--s2);
  border-radius:24px 24px 0 0;
  padding:20px 20px;
  padding-bottom:calc(20px + env(safe-area-inset-bottom, 0px));
  border-top:1px solid var(--b2);
  animation:slideUp .28s cubic-bezier(.4,0,.2,1);
  /* ensure modal sits above home indicator */
  margin-bottom:0;
}
/* tablet: centered card modal */
@media(min-width:768px){
  .modal-backdrop{align-items:center;}
  .modal-sheet{max-width:500px;border-radius:24px;margin-bottom:0;padding:24px;}
}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:none}}
.modal-handle{width:36px;height:4px;border-radius:2px;background:var(--b3);margin:0 auto 18px;}
.modal-title{font-size:17px;font-weight:700;margin-bottom:5px;}
.modal-sub{font-size:12.5px;color:var(--muted);line-height:1.6;margin-bottom:16px;}
.modal-sub a{color:var(--blue);text-decoration:none;}
.modal-sub code{background:var(--s3);padding:1px 5px;border-radius:4px;font-family:var(--mono);font-size:11px;}
.modal-input{width:100%;background:var(--s3);border:1.5px solid var(--b2);border-radius:12px;padding:12px 14px;font-size:14px;color:var(--txt);font-family:var(--mono);outline:none;margin-bottom:12px;transition:border-color .15s;}
.modal-input:focus{border-color:var(--blue);}
.modal-actions{display:flex;gap:8px;}
.modal-btn{flex:1;padding:12px;border-radius:12px;font-size:14px;font-weight:600;font-family:var(--font);border:none;cursor:pointer;transition:opacity .15s;}
.modal-btn:active{opacity:.8;}
.modal-btn.primary{background:var(--blue);color:#fff;}
.modal-btn.danger{background:rgba(248,113,113,.15);color:var(--red);border:1px solid rgba(248,113,113,.25);}
.modal-btn.ghost{background:var(--s3);color:var(--muted);border:1px solid var(--b2);}
.modal-section{margin-bottom:14px;}
.modal-section-title{font-size:12px;font-weight:600;color:var(--muted);margin-bottom:8px;text-transform:uppercase;letter-spacing:.06em;}

/* ══ SCREEN 2: STATS ══ */
#screen-stats{background:var(--bg);}
.stats-hdr{padding:16px 18px 12px;font-size:18px;font-weight:700;background:var(--s1);border-bottom:1px solid var(--b1);flex-shrink:0;}
.stats-scroll{flex:1;overflow-y:auto;padding:12px 14px 16px;display:flex;flex-direction:column;gap:12px;}
.stats-scroll::-webkit-scrollbar{display:none;}
.stat-card{background:var(--s2);border:1px solid var(--b1);border-radius:16px;padding:14px 16px;}
.stat-card-title{font-size:13px;font-weight:600;margin-bottom:12px;color:var(--txt);}
/* tablet: 2-column stat grid */
@media(min-width:768px){
  .stats-scroll{
    display:grid;
    grid-template-columns:1fr 1fr;
    grid-auto-rows:min-content;
    gap:14px;
    padding:16px;
    align-items:start;
  }
  .stats-hdr{font-size:20px;}
  /* heatmap card spans full width */
  .stat-card:has(#heatmap){grid-column:1/-1;}
}
/* streak */
.streak-row{display:flex;gap:8px;}
.streak-box{flex:1;background:var(--s3);border-radius:12px;padding:12px 8px;text-align:center;}
.streak-num{font-size:28px;font-weight:700;font-family:var(--mono);line-height:1;}
.streak-num.fire{color:var(--amber);}
.streak-num.blue{color:var(--blue);}
.streak-num.green{color:var(--green);}
.streak-lbl{font-size:10px;color:var(--muted);margin-top:4px;}
/* heatmap */
.heatmap{display:flex;gap:3px;overflow-x:auto;padding-bottom:4px;}
.heatmap::-webkit-scrollbar{display:none;}
.hm-col{display:flex;flex-direction:column;gap:3px;}
.hm-cell{width:12px;height:12px;border-radius:3px;background:var(--s3);transition:background .2s;}
.hm-cell.l1{background:rgba(52,211,153,.25);}
.hm-cell.l2{background:rgba(52,211,153,.5);}
.hm-cell.l3{background:rgba(52,211,153,.75);}
.hm-cell.l4{background:var(--green);}
.hm-cell.today-border{outline:2px solid var(--blue);outline-offset:1px;}
.hm-row{display:flex;align-items:center;gap:3px;margin-bottom:3px;}
.hm-lbl{width:16px;font-size:9px;color:var(--muted2);font-family:var(--mono);text-align:right;flex-shrink:0;}
/* subject bars */
.subj-bar-row{display:flex;flex-direction:column;gap:8px;}
.sbr{display:flex;align-items:center;gap:8px;}
.sbr-name{width:44px;text-align:center;flex-shrink:0;}
.sbr-track{flex:1;height:8px;background:var(--s3);border-radius:4px;overflow:hidden;}
.sbr-fill{height:100%;border-radius:4px;transition:width .5s ease;}
.sbr-cnt{font-size:11px;font-family:var(--mono);color:var(--muted);width:24px;text-align:right;flex-shrink:0;}
/* topic history */
.topic-list{display:flex;flex-direction:column;gap:6px;}
.topic-item{background:var(--s3);border-radius:10px;padding:10px 12px;}
.topic-date{font-size:10px;font-family:var(--mono);color:var(--muted2);margin-bottom:3px;}
.topic-text{font-size:13px;color:var(--txt);font-weight:500;}
.topic-subj{display:flex;align-items:center;gap:6px;font-size:10px;margin-top:4px;}
.empty-stats{text-align:center;color:var(--muted);font-size:12px;padding:20px 0;opacity:.6;}
/* sync dot */
.sync-dot{width:7px;height:7px;border-radius:50%;display:none;position:absolute;top:8px;right:calc(50% - 20px);}
.sync-dot.show{display:block;}
.sync-dot.loading{background:var(--amber);animation:pulse 1s infinite;}
.sync-dot.ok{background:var(--green);}
.sync-dot.err{background:var(--red);}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
</style>
</head>

<script>
/* ════════════════════ DATA ════════════════════ */
/* ── MATH0101 weekly topics (Week 1–15) ── */
const MATH_WEEKS = [
  { w:1,  topic:'Algebra — Numbers, Expressions, Functions & Graphs (Linear, Polynomial)' },
  { w:2,  topic:'Factor & Expansion, Trigonometry (Pythagoras, Basic & Inverse trig)', test:null },
  { w:3,  topic:'Law of sines/cosines, Trig identities & equations, Trig functions & waveform', test:'Test01 (6pt) — Expressions, Functions' },
  { w:4,  topic:'Operation of Functions, Composite/Inverse, Exponential & Log, Hyperbolic functions' },
  { w:5,  topic:'Differentiation — Limits & Continuity, Derivatives, Differentiation rules', test:'Test02 (7pt) — Trigonometry' },
  { w:6,  topic:'Techniques for Differentiation, Implicit differentiation, Higher derivatives', test:'Test03 (5pt) — Operation of Function, Transcendental Function' },
  { w:7,  topic:'Applications of Derivatives', test:'Midterm' },
  { w:8,  topic:'Integrations — Antiderivatives, Definite integral, Fundamental theorem of calculus' },
  { w:9,  topic:'Indefinite integrals, Substitution rule, Integration by parts', test:'Test04 (7pt) — Derivatives, Differentiation rules, Higher derivatives' },
  { w:10, topic:'Integration by partial fractions', test:'Test05 (7pt) — Implicit diff, Applications of derivatives' },
  { w:11, topic:'Applications of integration: Area, Arc length, Volume, Probability, Centroid/Moment', test:'Test06 (8pt) — Definite/Indefinite integrals, Substitution, IBP' },
  { w:12, topic:'Series — Infinite sequences, Summation notation, Mathematical induction' },
  { w:13, topic:'Alternative series & Absolute convergence', test:'Test07 (8pt) — Partial fractions, Applications of integration' },
  { w:14, topic:'Power series, Binomial series, Maclaurin & Taylor series', test:'Test08 (7pt) — Series' },
  { w:15, topic:'Complex Numbers', test:'Final Exam' },
];

/* ── PHYS0110 (Physics I) weekly topics ── */
const PHYS_WEEKS = [
  { w:1,  topic:'Measurement, Unit, Vector Algebra' },
  { w:2,  topic:'One Dimension Motion' },
  { w:3,  topic:'Force, Friction, Newton\'s Law' },
  { w:4,  topic:'Motion and Motion in 2D' },
  { w:5,  topic:'Circular Motion, Big G, Energy' },
  { w:6,  topic:'Power, Momentum' },
  { w:7,  topic:'Center of Mass, Oscillation' },
  { w:8,  topic:'Wave, Doppler, Resonance' },
  { w:9,  topic:'Rotation Motion' },
  { w:10, topic:'Fluid, Pressure, Buoy Force' },
  { w:11, topic:'Law of Ideal Gas, Kinetic Theory' },
  { w:12, topic:'Thermodynamics' },
];

/* helper: get current study week (MATH starts sat 13 Jun 2025) */
function getStudyWeek(){
  const start = new Date('2025-06-13');
  const now = new Date();
  const diff = Math.floor((now - start) / (7*24*60*60*1000));
  return Math.max(1, Math.min(15, diff + 1));
}
function getMathWeek(){ const w=getStudyWeek(); return MATH_WEEKS.find(x=>x.w===w)||MATH_WEEKS[0]; }
function getPhysWeek(){ const w=getStudyWeek(); const pw=Math.min(12,w); return PHYS_WEEKS.find(x=>x.w===pw)||PHYS_WEEKS[0]; }

const DAYS = [
  { name:'วันจันทร์', short:'จันทร์', isClassDay:false, sessions:[
    { id:'mon-1', label:'MATH0101 — ทบทวน Lecture เสาร์', get sub(){ return getMathWeek().topic; }, tag:'math' },
    { id:'mon-2', label:'EECC0232 — ทบทวน Lecture เสาร์', sub:'สรุป notes + แบบฝึกหัดวงจร', tag:'elec' },
    { id:'mon-3', label:'PHYS0110 — อ่านล่วงหน้าบทต่อไป', get sub(){ return getPhysWeek().topic; }, tag:'phys' },
  ]},
  { name:'วันอังคาร', short:'อังคาร', isClassDay:false, sessions:[
    { id:'tue-1', label:'MIIC1120 — Logic & Digital', sub:'logic gate / truth table / combinational circuit', tag:'dig' },
    { id:'tue-2', label:'MECH0110 — Free Body Diagram', sub:'statics / equilibrium', tag:'mech' },
    { id:'tue-3', label:'MATH0101 — โจทย์เพิ่มเติม', get sub(){ return getMathWeek().topic+' • ทำโจทย์'; }, tag:'math' },
  ]},
  { name:'วันพุธ', short:'พุธ', isClassDay:false, sessions:[
    { id:'wed-1', label:'PHYS0110 — Problem Set', get sub(){ return getPhysWeek().topic; }, tag:'phys' },
    { id:'wed-2', label:'ENCC0007 — เตรียม Lab Report', sub:'อ่านขั้นตอนทดลอง / pre-lab', tag:'phys' },
    { id:'wed-3', label:'MATH0101 — อ่านล่วงหน้า / ทำใบงาน', get sub(){ return getMathWeek().topic; }, tag:'math' },
  ]},
  { name:'วันพฤหัสบดี', short:'พฤหัส', isClassDay:false, sessions:[
    { id:'thu-1', label:'EECC0232 — เตรียมคาบอาทิตย์', sub:'MIIX304 + MIIX303 สองคาบต่อเนื่อง', tag:'elec' },
    { id:'thu-2', label:'MATH0101 — โจทย์ยาก / Past Exam', get sub(){ return getMathWeek().topic+' • past exam'; }, tag:'math' },
    { id:'thu-3', label:'PHYS0190 — ทบทวน Lab', sub:'เตรียมคาบอาทิตย์ค่ำ', tag:'phys' },
  ]},
  { name:'วันศุกร์', short:'ศุกร์', isClassDay:false, sessions:[
    { id:'fri-1', label:'MATH0101 — Weekly Review', get sub(){ const mw=getMathWeek(); return `Week ${mw.w}: ${mw.topic}`; }, tag:'math' },
    { id:'fri-2', label:'MIIC1120 — สรุป Mind Map', sub:'flashcard / สรุป chapter', tag:'dig' },
    { id:'fri-3', label:'เตรียมของสำหรับเสาร์', sub:'assignment ครบ / lab kit / handout', tag:'mech' },
  ]},
  { name:'วันเสาร์ 🎓', short:'เสาร์', isClassDay:true, sessions:[
    { id:'sat-1', label:'EECC0232 — Lecture', sub:'D502 • ไฟฟ้า Sec C2', tag:'elec', time:'8:00' },
    { id:'sat-2', label:'MATH0101 — Lecture', get sub(){ return `D504 • Sec F2 | ${getMathWeek().topic}`; }, tag:'math', time:'10:30' },
    { id:'sat-3', label:'PHYS0110 — Lecture', get sub(){ return `F504 • Sec D2 | ${getPhysWeek().topic}`; }, tag:'phys', time:'13:30' },
    { id:'sat-4', label:'MIIC1120 — Lecture', sub:'MII207A • ดิจิทัล Sec B', tag:'dig', time:'16:00' },
    { id:'sat-5', label:'MECH0110 — Lecture', sub:'F502 • กลศาสตร์ Sec B', tag:'mech', time:'18:30' },
  ]},
  { name:'วันอาทิตย์ 🎓', short:'อาทิตย์', isClassDay:true, sessions:[
    { id:'sun-1', label:'MATH0101 — Tutorial (E1/E2/F1/F2)', get sub(){ const mw=getMathWeek(); return mw.test?`📝 ${mw.test} | สอบ 10:00–10:30น • ${mw.topic}`:`ทำใบงาน • ${mw.topic}`; }, tag:'math', time:'10:00' },
    { id:'sun-2', label:'MIIC1120 — Tutorial', sub:'MIIX302 • ดิจิทัล Sec B', tag:'dig', time:'13:30' },
    { id:'sun-3', label:'EECC0232 — Tutorial (กลุ่ม 1)', sub:'MIIX304 • ไฟฟ้า Sec C2', tag:'elec', time:'16:00' },
    { id:'sun-4', label:'EECC0232 — Tutorial (กลุ่ม 2)', sub:'MIIX303 • ไฟฟ้า Sec C2', tag:'elec', time:'16:00' },
    { id:'sun-5', label:'PHYS0190 — Lab', sub:'K202 • ปฏิบัติฟิสิกส์ Sec D2', tag:'phys', time:'18:30' },
  ]},
];

/* ════════════════════ STATE ════════════════════ */
let state = JSON.parse(localStorage.getItem('st_s6')||'{}');
// history: { "2024-06-09": { sessions:{id:bool}, topics:{id:str} } }
let history = JSON.parse(localStorage.getItem('st_hist')||'{}');
let msgs = JSON.parse(localStorage.getItem('st_m6')||'[]');
const dayMap = {1:0,2:1,3:2,4:3,5:4,6:5,0:6};
let activeDay = dayMap[new Date().getDay()]??0;
let curScreen = 'schedule';
let gistId = localStorage.getItem('st_gist_id')||'';

const todayKey = () => new Date().toISOString().slice(0,10);
const save = () => {
  localStorage.setItem('st_s6', JSON.stringify(state));
  // snapshot today into history
  const tk = todayKey();
  if (!history[tk]) history[tk] = {sessions:{}, topics:{}};
  DAYS.forEach(day => day.sessions.forEach(s => {
    if (state[s.id]) history[tk].sessions[s.id] = true;
    if (state[s.id+'_topic']) history[tk].topics[s.id] = state[s.id+'_topic'];
  }));
  localStorage.setItem('st_hist', JSON.stringify(history));
  debouncedSync();
};
const saveMsgs = () => localStorage.setItem('st_m6', JSON.stringify(msgs.slice(-30)));
const doneCnt = i => DAYS[i].sessions.filter(s=>state[s.id]).length;
const isDone = i => doneCnt(i) === DAYS[i].sessions.length;
const getOrKey = () => localStorage.getItem('st_orkey')||'';
const getGhToken = () => localStorage.getItem('st_ghtoken')||'';

/* ════════════════════ GIST SYNC ════════════════════ */
let syncTimer = null;
function debouncedSync(){ clearTimeout(syncTimer); syncTimer=setTimeout(syncToGist,2000); }

function setSyncDot(status){ // 'loading'|'ok'|'err'|'hide'
  const dot = document.getElementById('sync-dot');
  dot.className = 'sync-dot';
  if(status==='hide'){return;}
  dot.classList.add('show',status);
}

async function syncToGist(){
  const token = getGhToken();
  if(!token) return;
  setSyncDot('loading');
  const payload = JSON.stringify({ state, history }, null, 2);
  const files = { 'study-tracker-data.json': { content: payload } };
  try {
    let res;
    if(gistId){
      res = await fetch(`https://api.github.com/gists/${gistId}`,{
        method:'PATCH',
        headers:{'Authorization':'Bearer '+token,'Content-Type':'application/json'},
        body:JSON.stringify({files})
      });
    } else {
      res = await fetch('https://api.github.com/gists',{
        method:'POST',
        headers:{'Authorization':'Bearer '+token,'Content-Type':'application/json'},
        body:JSON.stringify({description:'Study Tracker Data',public:false,files})
      });
    }
    const data = await res.json();
    if(data.id){
      gistId = data.id;
      localStorage.setItem('st_gist_id', gistId);
      setSyncDot('ok');
      setTimeout(()=>setSyncDot('hide'),3000);
    } else { throw new Error(data.message||'sync failed'); }
  } catch(e){ setSyncDot('err'); console.error('Gist sync:',e); }
}

async function syncFromGist(){
  const token = getGhToken();
  if(!token||!gistId) return;
  setSyncDot('loading');
  try{
    const res = await fetch(`https://api.github.com/gists/${gistId}`,{
      headers:{'Authorization':'Bearer '+token}
    });
    const data = await res.json();
    const content = data.files?.['study-tracker-data.json']?.content;
    if(content){
      const parsed = JSON.parse(content);
      state = parsed.state||{};
      history = parsed.history||{};
      localStorage.setItem('st_s6', JSON.stringify(state));
      localStorage.setItem('st_hist', JSON.stringify(history));
      buildSlides(); goDay(activeDay,false);
      buildStrip(); updateWeekDots();
      setSyncDot('ok'); setTimeout(()=>setSyncDot('hide'),2000);
    }
  } catch(e){ setSyncDot('err'); }
}

function buildSlides(){

function calcStreak(){
  const keys=Object.keys(history).filter(k=>Object.keys(history[k].sessions||{}).length>0).sort();
  if(!keys.length)return{current:0,best:0};
  let cur=1,best=1,prev=keys[keys.length-1];
  for(let i=keys.length-2;i>=0;i--){
    const d1=new Date(prev),d2=new Date(keys[i]);
    const diff=(d1-d2)/(1000*86400);
    if(diff===1){cur++;best=Math.max(best,cur);}
    else break;
    prev=keys[i];
  }
  // check if today is in streak
  const today=todayKey();
  const yesterday=new Date(Date.now()-86400000).toISOString().slice(0,10);
  if(prev!==today&&prev!==yesterday) cur=0;
  return{current:cur,best:Math.max(best,cur)};
}

function buildHeatmap(el){
  // build 12 weeks grid (Mon-Sun columns)
  const today=new Date(); today.setHours(0,0,0,0);
  const days=84; // 12 weeks
  const start=new Date(today); start.setDate(today.getDate()-days+1);
  // find Monday of start week
  const dow=start.getDay(); const adj=(dow===0?6:dow-1);
  start.setDate(start.getDate()-adj);
  const weeks=[]; let week=[];
  let d=new Date(start);
  while(d<=today||week.length%7!==0){
    week.push(new Date(d));
    if(week.length===7){weeks.push(week);week=[];}
    d.setDate(d.getDate()+1);
    if(weeks.length>=13)break;
  }
  const labels=['จ','อ','พ','พฤ','ศ','ส','อา'];
  // render as rows (days of week) x cols (weeks)
  for(let row=0;row<7;row++){
    const rowEl=document.createElement('div'); rowEl.className='hm-row';
    const lbl=document.createElement('div'); lbl.className='hm-lbl'; lbl.textContent=labels[row];
    rowEl.appendChild(lbl);
    weeks.forEach(wk=>{
      const cell=document.createElement('div'); cell.className='hm-cell';
      if(row<wk.length){
        const dd=wk[row]; const key=dd.toISOString().slice(0,10);
        const cnt=Object.keys(history[key]?.sessions||{}).length;
        if(cnt>=5)cell.classList.add('l4');
        else if(cnt>=3)cell.classList.add('l3');
        else if(cnt>=1)cell.classList.add('l2');
        else if(dd<=today)cell.classList.add('l1');
        if(key===todayKey())cell.classList.add('today-border');
      }
      rowEl.appendChild(cell);
    });
    el.appendChild(rowEl);
  }
}

function calcSubjectStats(){
  const counts={math:0,elec:0,dig:0,phys:0,mech:0};
  Object.values(history).forEach(day=>{
    Object.keys(day.sessions||{}).forEach(sid=>{
      DAYS.forEach(d=>d.sessions.forEach(s=>{
        if(s.id===sid&&counts[s.tag]!==undefined)counts[s.tag]++;
      }));
    });
  });
  return Object.fromEntries(Object.entries(counts).filter(([,v])=>v>0).sort((a,b)=>b[1]-a[1]));
}

function buildTopicHistory(){
  const result=[];
  Object.entries(history).sort((a,b)=>b[0].localeCompare(a[0])).slice(0,14).forEach(([date,day])=>{
    Object.entries(day.topics||{}).forEach(([sid,topic])=>{
      if(!topic)return;
      let found=null;
      DAYS.forEach((d,di)=>d.sessions.forEach(s=>{if(s.id===sid)found={...s,dayName:d.short};}));
      if(found)result.push({date,day:found.dayName,label:found.label,tag:found.tag,topic});
    });
  });
  return result.slice(0,20);
}

    document.body.style.cssText=`
      transform:rotate(90deg) translateX(0) translateY(-${short}px);
      transform-origin:top left;
      width:${long}px;
      height:${short}px;
      overflow:hidden;
      position:fixed;
